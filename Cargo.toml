[package]
name = "buildkit-operator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "crdgen"
path = "src/crdgen.rs"

[dependencies]
kube = { version = "5.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.29", features = ["latest", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3.34"
jiff = "0.2.39"
tracing = "0.1.44"
thiserror = "2.0.21"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
