apiVersion: v1
kind: Namespace
metadata:
  name: buildkit-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: buildkit-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkit-dev-registry
  template:
    metadata:
      labels:
        app: buildkit-dev-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: buildkit-dev
spec:
  type: NodePort
  selector:
    app: buildkit-dev-registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
