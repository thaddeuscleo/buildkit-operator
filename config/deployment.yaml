apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkit-operator
  namespace: default
  labels:
    app.kubernetes.io/name: buildkit-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkit-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit-operator
    spec:
      serviceAccountName: buildkit-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: buildkit-operator:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
